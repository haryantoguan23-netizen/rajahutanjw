<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mohon Tunggu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #121826; color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 680px); padding: 48px 32px; text-align: center;
      background: #202b40; border: 1px solid #344258; border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 18px; font-size: clamp(30px, 5vw, 46px); }
    p { color: #dbe5f5; font-size: 18px; line-height: 1.6; }
    #count { margin: 24px 0; font-size: clamp(76px, 14vw, 112px); font-weight: 700; }
    .note { font-size: 15px; color: #b8c6dc; }
    a {
      display: inline-block; margin-top: 18px; padding: 14px 26px;
      color: white; background: #4169e1; border-radius: 12px;
      text-decoration: none; font-weight: 700;
    }
    a:hover { background: #3156c9; }
  </style>
</head>
<body>
  <main>
    <h1>Mohon Tunggu</h1>
    <p>Anda akan diarahkan ke joker11 dalam:</p>
    <div id="count" aria-live="polite">5</div>
    <p class="note">Halaman akan terbuka otomatis setelah hitungan selesai.</p>
    <a id="continue" href="https://www.crazygames.com/">Lanjutkan sekarang</a>
  </main>
  <script>
    (() => {
      const destination = "https://www.crazygames.com/";
      let remaining = 5;
      const counter = document.getElementById("count");
      const button = document.getElementById("continue");
      button.href = destination;

      const timer = window.setInterval(() => {
        remaining -= 1;
        counter.textContent = String(remaining);
        if (remaining <= 0) {
          window.clearInterval(timer);
          window.location.replace(destination);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
